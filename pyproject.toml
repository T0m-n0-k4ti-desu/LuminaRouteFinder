[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "lumina-route-finder"
version = "1.0.3"
description = "Local image recognition and longest path search for Lumina Corridor"
requires-python = ">=3.10"
dependencies = ["numpy>=1.24,<3", "opencv-python>=4.9,<5", "tkinterdnd2>=0.7,<1", "Pillow>=12,<13"]

[project.scripts]
lumina-route-finder = "lumina_route_finder.__main__:main"

[project.gui-scripts]
lumina-route-finder-gui = "lumina_route_finder.gui:main"

[tool.setuptools.packages.find]
include = ["lumina_route_finder*"]

[tool.setuptools.package-data]
lumina_route_finder = ["assets/*.png", "assets/content_icons/*.png"]
